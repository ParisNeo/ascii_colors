[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-pen"
version = "0.2.0"
description = "A minimalist terminal text editor with syntax highlighting and clipboard support, built on the ascii_colors TUI."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ParisNeo" }]
keywords = ["tui", "editor", "terminal", "syntax-highlighting", "ascii-colors"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors",
    "Topic :: Terminals",
]
dependencies = ["ascii_colors"]

[project.scripts]
pen = "pen.cli:main"

[tool.setuptools]
packages = ["pen"]